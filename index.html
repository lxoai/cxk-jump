<script>
(function(){
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const jumpsEl = document.getElementById('jumps');
const bestEl = document.getElementById('best');

const sBgm = document.getElementById('sBgm');

// 公网分享地址
const SHARE_URL = 'https://lxoai.github.io/cxk-jump/';

let W = 0, H = 0, DPR = 1;
let groundY = 0, topY = 0;
let gameT = 0;
let best = +(localStorage.getItem('cxk_jump_best') || 0);
bestEl.textContent = '最高 ' + best;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  groundY = H * 0.80;
  topY = groundY - 130;
}
window.addEventListener('resize', resize);

/* ---------------- 物理常量 ---------------- */
const G = 2600;          // 重力 px/s^2
const VY0 = 1150;        // 起跳初速度
const CHARGE_TIME = 0.9; // 蓄力满所需秒数
const MAX_VX = 440;      // 最大水平速度
const P_W = 44, P_H = 58;// 角色尺寸
const MAX_DIST = MAX_VX * (2 * VY0 / G); // 满蓄力最远水平距离 ≈ 389
const LAND_PAD = 24;     // 落地判定宽容（角色中心距方块边缘）

const STATE = { READY:0, IDLE:1, CHARGE:2, FLY:3, DEAD:4 };
let state = STATE.READY;
let score = 0, jumps = 0, charge = 0, holdT = 0, deadT = 0;
let combo = 0, mult = 1, perfects = 0, maxCombo = 0;
let coins = +(localStorage.getItem('cxk_coins') || 0);
let coinsAtStart = 0;
let camX = 0, timeLeft = 0, diedBy = 'fall';
let cardDataUrl = '';
let popups = [], particles = [];
let redMoon = false, fans = [], letters = [], fanT = 0, nextFanIn = 0, flashT = 0;
let moveLeft = false, moveRight = false, firePressed = false, fireCd = 0;
let playerBullets = [], lionBullets = [];
let lion = null, lionPending = 0, nextLionScore = 100, nextBigLionScore = 1000;
let vehicle = null, nextVehScore = 600;

const player = { x:0, y:0, vx:0, vy:0, rot:0, sx:1, sy:1, targetBox:null, landed:false, standingBox:null, springLaunch:false };

const boxes = [];
const COLORS = [
  ['#f9a8c4','#f472a0'], ['#a7d8f9','#5fa8e0'], ['#b8e6b0','#7bc97f'],
  ['#f9e08a','#f0b83a'], ['#d4b8f0','#a87de0'], ['#f7b57a','#ef8f3f'],
  ['#9ee8dd','#4fc4b4'], ['#f2a2a2','#e06a6a']
];

const MEMES = ['鸡你太美','你干嘛～','小黑子','唱跳Rap篮球','坤坤加油','铁山靠','只因你太美','篮球梦'];
const MILESTONE = ['鸡你太美！','太美了！','坤坤附体','封神了','无敌了'];
const DIE_HINTS = [
  '食不食油饼？（是不是有病）',
  '小黑子露出鸡脚了吧',
  '盐以律己，甜以待人',
  '只因你太美，可惜太短命',
  '鸡你太美，命数已尽',
  '唱、跳、Rap、篮球，样样不行',
  '中分头的诅咒',
  '铁山靠，靠不住',
  '背带裤绊脚了',
  '你是我的神，但神也会死',
  '篮球梦，碎了',
  'ikun 不哭，站起来哭',
  '鸡你太美，再来亿遍',
  '油饼吃饱了，上路吧',
  '黑子别跑，撞到鸡脚了'
];
const DIE_TITLES = { fall:'跳空了！', crack:'踩碎了！', slide:'被甩下去了！', time:'时间到！', lawyer:'被律师函击中了！', lion:'被狮子扑倒了！', plant:'吃了葵菜！', car:'被汽车撞飞了！', boat:'被快艇撞飞了！' };
const DIE_SUBS = { fall:'你干嘛～ 哈哈哎哟', crack:'碎台子不是好惹的…', slide:'移动台子会甩人！', time:'60 秒结束，跳得不错嘛', lawyer:'真爱粉的怒火，收下吧！', lion:'狮子座的力量，你干嘛～', plant:'那是坤坤的菜你也敢吃…', car:'汽运（气运）到头了…', boat:'开艇（开庭）了，律师函都不够用' };

const MODES = {
  classic: { label:'🎮 经典模式' },
  timed:   { label:'⏱ 限时60秒' },
  speedy:  { label:'⚡ 极速模式' },
  daily:   { label:'📅 每日挑战' }
};

const SKINS = [
  { id:'kun',  name:'坤坤',   ico:'🕺', price:0 },
  { id:'hei',  name:'乌鸡',   ico:'🖤', price:100 },
  { id:'ball', name:'篮球',   ico:'🏀', price:300 },
  { id:'gold', name:'金鸡', ico:'🐔', price:600 }
];
let owned = (localStorage.getItem('cxk_skins') || 'kun').split(',');
let skin = localStorage.getItem('cxk_skin') || 'kun';
if(!owned.includes(skin)) skin = 'kun';

/* ---------------- 随机数（每日模式用种子） ---------------- */
let rng = Math.random;
function rnd(a,b){ return a + rng()*(b-a); }
function pick(arr){ return arr[(rng()*arr.length)|0]; }
function hashStr(s){
  let h = 1779033703 ^ s.length;
  for(let i = 0; i < s.length; i++){
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function dateStr(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

/* ---------------- 模式与方块生成 ---------------- */
let mode = 'classic';

function genParams(){
  const s = score;
  if(mode === 'speedy'){
    const d = Math.min(s * 1.9, 70);
    return { wMin: 84 - d*0.85, wMax: 132 - d*0.85, gapMin: 40 + d*1.2, gapMax: Math.min(120 + d*0.6, 128) };
  }
  const d = Math.min(s, 40);
  const gapCap = mode === 'timed' ? 165 : 160;
  return { wMin: 84 - d*0.7, wMax: 132 - d*0.7, gapMin: 40 + d*1.6, gapMax: Math.min(148 + d*1.6, gapCap) };
}

function makeBox(baseX, w, type, moving, plant){
  const c = pick(COLORS);
  const b = { baseX:baseX, x:baseX, w:w, type:type, moving:moving, top:c[0], front:c[1], canPerfect:true };
  if(plant) b.plant = plant;
  if(type === 'spring'){ b.top = '#b6f2a8'; b.front = '#67cf57'; b.canPerfect = false; }
  if(type === 'cracked'){ b.top = '#cfc3b4'; b.front = '#a89b8a'; }
  if(moving){
    b.range = rnd(18, 32);
    b.spd = rnd(0.9, 1.5);
    b.phase = rng() * Math.PI * 2;
    b.prevX = baseX;
  }
  return b;
}

function spawnNext(){
  const last = boxes[boxes.length - 1];
  const p = genParams();
  const w = rnd(p.wMin, p.wMax);
  const gap = rnd(p.gapMin, p.gapMax);
  const idx = boxes.length;
  let type = 'normal';
  if(idx >= 3){
    const r = rng();
    if(r < 0.10) type = 'spring';
    else if(r < 0.21) type = 'cracked';
    else if(r < 0.33) type = 'coin';
  }
  let moving = false;
  if(idx >= 3 && type === 'normal' && gap >= 70 && rng() < 0.15) moving = true;
  let plant = null;
  if(idx >= 3 && w >= 80 && (type === 'normal' || type === 'coin') && rng() < 0.10){
    plant = { x: (rng() < 0.5 ? 10 : w - 10) }; // 葵菜钉在台子边缘
  }
  const baseX = (last.moving ? last.baseX : last.x) + last.w + gap;
  boxes.push(makeBox(baseX, w, type, moving, plant));
}

let soundOn = true;
let actx = null;
function audioCtx(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
  return actx;
}
function tone(freq, dur, type, vol, delay){
  if(!soundOn) return;
  const a = audioCtx(); if(!a) return;
  const t0 = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function playPerfect(){ tone(880, 0.12, 'triangle', 0.16); tone(1320, 0.18, 'triangle', 0.16, 0.09); }
function playSpring(){ tone(280, 0.08, 'square', 0.11); tone(480, 0.1, 'square', 0.11, 0.07); tone(760, 0.14, 'square', 0.11, 0.14); }

function playFail(){ try{ if(!soundOn) return; sFail.currentTime = 0; sFail.play(); }catch(e){} }

function esc(s){ return String(s).replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }
function isToday(ts){
  const d = new Date(ts), n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
}
function lbFilter(scores){
  return scores.filter(function(s){

async function getLbId(){
  const cache = localStorage.getItem('cxk_lb');
  if(cache){
    try{ const c = JSON.parse(cache); if(Date.now() - c.t < 6*3600e3) return c.id; }catch(e){}
  }
  const r = await fetch(LB_PTR, { cache: 'no-store' });
  const j = await r.json();
  const id = JSON.parse(atob(j.content)).id;
  localStorage.setItem('cxk_lb', JSON.stringify({ id: id, t: Date.now() }));
  return id;
}
async function lbRead(){
  if(!lbId) lbId = await getLbId();
  const r = await fetch(LB_API + lbId, { cache: 'no-store' });
  const j = await r.json();
  return Array.isArray(j.scores) ? j.scores : [];
}
async function lbSubmit(entry){
  if(!lbId) lbId = await getLbId();

  scores.sort(function(a,b){ return (b.score - a.score) || (b.jumps - a.jumps) || (b.ts - a.ts); });
  if(scores.length > 300) scores = scores.slice(0, 300);
  const r = await fetch(LB_API + lbId, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ scores: scores })
  });
  if(!r.ok) throw new Error('write failed');
}

function perfectZone(box){ return Math.max(10, Math.min(18, box.w * 0.22)); }
function isPerfect(box, x){ return Math.abs(x - (box.x + box.w/2)) <= perfectZone(box); }

}

function burst(x, y, color, n){

  for(let i = 0; i < n; i++){
    particles.push({
      x: x, y: y,
      vx: rnd(-140, 140), vy: rnd(-260, -40),

    });

}

/* ---------------- 落地（无自动归位！） ---------------- */
function landOn(box, scored){
  // 葵菜陷阱：踩到就吃菜升天
  if(box.plant && Math.abs(player.x - (box.x + box.plant.x)) < 14){
    player.y = topY;
    player.vx = 0; player.vy = 0;
    player.sx = 1.25; player.sy = 0.75;
    player.landed = false;
    popup('误食葵菜！', '#7ec850', true);
    burst(player.x - camX, topY - 20, '#7ec850', 20);
    burst(player.x - camX, topY - 20, '#ffd23e', 10);
    die('plant');
    return;
  }
  player.y = topY;
  player.vx = 0; player.vy = 0;
  player.rot = 0;
  player.sx = 1.25; player.sy = 0.75;
  player.landed = false;
  player.standingBox = box;
  state = STATE.IDLE;

  if(scored){
    while(boxes.length > 1 && boxes[0] !== box) boxes.shift();
    player.targetBox = boxes[1] || null;
    while(boxes.length < 5) spawnNext();
    if(!player.targetBox) player.targetBox = boxes[1];

    const isP = box.canPerfect !== false && isPerfect(box, player.x);
    const base = (box.type === 'cracked') ? 15 : 5;
    if(isP){
      combo++; maxCombo = Math.max(maxCombo, combo);
      mult = Math.min(5, 1 + 0.5 * (combo - 1));
      perfects++;
      addScore(pts(Math.round(25 * mult)));
      addCoin(1);
      popup('PERFECT +' + pts(Math.round(25 * mult)), '#ffd700', true);
      burst(player.x - camX, topY - 26, '#ffd700', 18);
      playPerfect();
    } else {
      combo = 0; mult = 1;
      addScore(pts(Math.round(base * mult)));
      popup('+' + pts(Math.round(base * mult)), '#5fa8e0', false);
    }
    updateComboHud();

    checkMilestones();

    if(box.type === 'coin'){
      addCoin(2);
      popup('💰 +2', '#ffb64d', false);
      burst(player.x - camX, topY - 24, '#ffc940', 12);
      playCoin();
    }
    if(box.type === 'cracked'){
      box.cracked = true; box.crackT = 0;
      popup('咔嚓！快走', '#c98a4a', false);
      playCrack();
    }
    if(box.type === 'spring'){
      popup('弹簧！', '#3ecf8e', false);
      burst(player.x - camX, topY - 22, '#7be0ff', 14);
      playSpring();
      state = STATE.FLY;
      // 自适应弹射：按到下一个台子中心的距离算速度，保证落得到
      const tgt2 = player.targetBox;
      const dT = tgt2 ? Math.max(0, (tgt2.x + tgt2.w/2) - player.x) : MAX_DIST;
      const springFlight = 2 * VY0 * 1.18 / G;
      player.vx = Math.min(MAX_VX * 1.25, Math.max(80, dT / springFlight));
      player.vy = -VY0 * 1.18;
      player.landed = false;
      player.standingBox = null;
      player.springLaunch = true;
      jumps++;
      jumpsEl.textContent = jumps + ' 跳';
      playJump();
      return;
    }
    if(score % 10 === 0){
      popup(pick(MILESTONE), '#e0688a', true, W/2, H*0.3);
      addCoin(3);
    }
  } else {
    combo = 0; mult = 1;
    updateComboHud();
    popup('太短了…', '#8a97ad', false);
  }
}

  state = STATE.DEAD;
  deadT = 0;
  player.vx = 0;
  if(reason) diedBy = reason;
  playFail();
}

function spawnLion(big){
  // 狮子站在目标台后一格（boxes[2]），玩家先落地目标台再对射
  const tgt = boxes[2];
  if(!tgt || tgt.dead) return;
  lion = {
    big: !!big,
    box: tgt,
    x: tgt.x + tgt.w/2,
    y: topY,
    hp: big ? 6 : 2,
    maxHp: big ? 6 : 2,
    t: 0,
    shootIn: big ? 1.2 : 2.0 + Math.random() * 0.8,
    dead: false, deadT: 0,
    wob: Math.random() * 6.28
  };
  popup(big ? '🦁 精英大狮子出现！' : '🦁 小狮子出现！', '#ffb400', big);
  playLionRoar();
}

function killLion(){
  if(!lion) return;
  const big = lion.big;
  burst(lion.x - camX, topY - 30, '#ffb400', 30);
  burst(lion.x - camX, topY - 30, '#ff6b3c', 20);
  popup(big ? '精英狮子击退！+200' : '狮子座击退！+50', '#ffb400', big);
  addScore(pts(big ? 200 : 50));
  addCoin(big ? 15 : 3);
  playSpring();
  lion.dead = true; lion.deadT = 0;
  checkMilestones();
  if(lionPending){
    spawnLion(lionPending === 2);
    lionPending = 0;
  }
}

function spawnVehicle(){
  const dir = Math.random() < 0.5 ? 1 : -1;
  vehicle = {
    skin: Math.random() < 0.5 ? 'car' : 'boat',
    dir: dir,
    x: dir > 0 ? -90 : W + 90,
    y: topY + 8,
    speed: 460 + Math.random() * 80,
    warnT: 1.2
  };
  playVehicle();
}

function checkMilestones(){
  while(nextLionScore <= score){
    if(!lion) spawnLion(false); else lionPending = Math.max(lionPending, 1);
    nextLionScore += 100;
  }
  while(nextBigLionScore <= score){
    if(!lion) spawnLion(true); else lionPending = 2;
    nextBigLionScore += 1000;
  }
  while(nextVehScore <= score){
    nextVehScore += 600;
    if(!vehicle) spawnVehicle();
  }
  if(!redMoon && score >= 1000) enterRedMoon();
}

/* ---------------- 更新 ---------------- */
let last = 0;
function update(dt){
  dt = Math.min(dt, 0.025);
  gameT += dt;

  // 方块：移动台子的摆动 + 碎台子计时
  for(const b of boxes){
    if(b.moving){
      b.prevX = b.x;
      b.phase += b.spd * dt;
      b.x = b.baseX + Math.sin(b.phase) * b.range;
    }
    if(b.cracked && !b.dead){
      b.crackT += dt;
      if(b.crackT >= 0.9){
        b.dead = true; b.fallT = 0;
        if(player.standingBox === b && (state === STATE.IDLE || state === STATE.CHARGE)){
          popup('踩碎了！', '#c98a4a', true);
          die('crack');
        }
      }
    }
    if(b.dead){
      b.fallT += dt;
      b.fallY = b.fallT * b.fallT * 700;
      b.rot = Math.min(b.fallT * 6, 1.2);
    }
  }

  // 站在移动台子上：跟着走，被甩下去会死
  if((state === STATE.IDLE || state === STATE.CHARGE) && player.standingBox){
    const sb = player.standingBox;
    if(sb.moving){
      player.x += sb.x - sb.prevX;
      if(player.x < sb.x - LAND_PAD || player.x > sb.x + sb.w + LAND_PAD){
        popup('被甩下去了！', '#8a97ad', true);
        die('slide');
      }
    }
  }

  // 左右走位（马里奥式，蓄力时也能调整瞄准）
  if((state === STATE.IDLE || state === STATE.CHARGE) && player.standingBox){
    let mv = 0;
    if(moveLeft) mv -= 1;
    if(moveRight) mv += 1;
    if(mv !== 0){
      player.x += mv * 235 * dt;
      const sb = player.standingBox;
      player.x = Math.max(sb.x - 18, Math.min(sb.x + sb.w + 18, player.x));
    }
  }

  // 落地压扁回弹
  if(state === STATE.IDLE){
    player.sx += (1 - player.sx) * Math.min(1, dt*10);
    player.sy += (1 - player.sy) * Math.min(1, dt*10);
  }

  if(state === STATE.CHARGE){
    holdT += dt;
    charge = holdT / CHARGE_TIME;
    const c = Math.min(charge, 1);
    player.sx = 1 + 0.38*c;
    player.sy = 1 - 0.30*c;
  }

  if(state === STATE.FLY){
    player.sx += (1 - player.sx) * Math.min(1, dt*10);
    player.sy += (1 - player.sy) * Math.min(1, dt*10);
    player.vy += G * dt;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.rot = Math.min(player.vx * 0.0011, 0.32);

    // 落地检测：脚越过台面后逐帧判断（移动台子实时位置）
    if(player.y >= topY && !player.landed){
      const cur = boxes[0];
      const tgt = player.targetBox;
      const curAlive = !cur.dead;
      const onCur = curAlive && player.x >= cur.x - LAND_PAD && player.x <= cur.x + cur.w + LAND_PAD;
      const onTgt = tgt && !tgt.dead && player.x >= tgt.x - LAND_PAD && player.x <= tgt.x + tgt.w + LAND_PAD;
      const lionOnTgt = lion && !lion.dead && lion.box === tgt;
      if(onCur && !onTgt){
        landOn(cur, false);
      } else if(onTgt && !lionOnTgt){
        landOn(tgt, true);
      } else if(onTgt && lionOnTgt && player.springLaunch){
        // 弹簧弹射撞上狮子：狮子被撞退一格（避免无法控制的必死）
        lion.box = boxes[2] || boxes[1];
        lion.x = lion.box.x + lion.box.w/2;
        popup('狮子被撞退了！', '#ffb400', false);
        landOn(tgt, true);
      } else if(onTgt && lionOnTgt){
        popup('被狮子扑倒了！', '#ffa040', true);
        burst(player.x - camX, player.y - 20, '#ffb400', 20);
        die('lion');
      } else if(player.y > topY + 70){
        die('fall');
      }
    }
  }

  // 红月：真爱粉出现（只在玩家站立时生成，保证可反应）
  if(redMoon && state === STATE.IDLE){
    fanT += dt;
    if(fanT >= nextFanIn){
      fanT = 0;
      nextFanIn = 3.4 + Math.random() * 2.0;
      spawnFan();
    }
  }
  for(let i = fans.length - 1; i >= 0; i--){
    const f = fans[i];
    f.t += dt;
    if(f.t >= f.launchT){
      letters.push({ x: f.x, y: f.y, vy: 80, rot: Math.random()*0.7 - 0.35, spin: Math.random()*4.4 - 2.2 });
      fans.splice(i, 1);
      tone(880, 0.05, 'square', 0.04);
    }
  }
  for(let i = letters.length - 1; i >= 0; i--){
    const l = letters[i];
    l.vy += 520 * dt;
    l.y += l.vy * dt;
    l.rot += l.spin * dt;
    if(l.y > topY + 90){ letters.splice(i, 1); continue; }
    if(state !== STATE.DEAD && state !== STATE.READY){
      const dx = Math.abs(l.x - player.x);
      const dy = Math.abs(l.y - (player.y - 18));
      if(dx < 24 && dy < 38){
        burst(l.x - camX, l.y - 10, '#e02020', 26);
        burst(l.x - camX, l.y - 10, '#fff', 10);
        letters.splice(i, 1);
        die('lawyer');
        continue;
      }
    }
  }
  if(flashT > 0) flashT -= dt;

  // 射击：连发冷却 + 玩家篮球子弹
  fireCd -= dt;
  if(firePressed) fire();
  for(let i = playerBullets.length - 1; i >= 0; i--){
    const b = playerBullets[i];
    b.x += b.vx * dt;
    b.rot += 10 * dt;
    let hit = false;
    if(lion && !lion.dead && Math.abs(b.x - lion.x) < 26 && Math.abs(b.y - (topY - 26)) < 36){
      lion.hp--;
      hit = true;
      burst(b.x - camX, b.y, '#ffb400', 10);
      tone(400, 0.06, 'square', 0.08);
      if(lion.hp <= 0) killLion();
    }
    if(hit || b.x > camX + W + 60) playerBullets.splice(i, 1);
  }

  // 狮子：AI 射击 + 死亡动画
  if(lion && !lion.dead){
    if(lion.box && lion.box.moving) lion.x = lion.box.x + lion.box.w/2;
    lion.t += dt;
    if(lion.t >= lion.shootIn){
      lion.t = 0;
      lion.shootIn = lion.big ? 1.2 + Math.random() * 0.4 : 2.0 + Math.random() * 0.8;
      lionBullets.push({ x: lion.x - 20, y: topY - 26 + (Math.random()*8 - 4), vx: lion.big ? -370 : -260, rot: 0 });
      if(lion.big && Math.random() < 0.3) lionBullets.push({ x: lion.x - 20, y: topY - 38, vx: -340, rot: 0 });
      tone(300, 0.08, 'square', 0.06);
    }
  } else if(lion && lion.dead){
    lion.deadT += dt;
    if(lion.deadT > 0.6) lion = null;
  }

  // 狮子篮球子弹（朝玩家飞来）
  for(let i = lionBullets.length - 1; i >= 0; i--){
    const b = lionBullets[i];
    b.x += b.vx * dt;
    b.rot += 8 * dt;
    if(b.x < camX - 60){ lionBullets.splice(i, 1); continue; }
    if(state !== STATE.DEAD && state !== STATE.READY){
      if(Math.abs(b.x - player.x) < 20 && Math.abs(b.y - (player.y - 20)) < 30){
        burst(b.x - camX, b.y, '#ff6b3c', 16);
        lionBullets.splice(i, 1);
        die('lion');
        continue;
      }
    }
  }

  // 汽运/开艇：汽车与快艇突袭
  if(vehicle){
    if(vehicle.warnT > 0){
      vehicle.warnT -= dt;
    } else {
      vehicle.x += vehicle.dir * vehicle.speed * dt;
      if(vehicle.x < -160 || vehicle.x > W + 160) vehicle = null;
    }
    if(vehicle && state !== STATE.DEAD && state !== STATE.READY && vehicle.warnT <= 0){
      if(Math.abs(vehicle.x - (player.x - camX)) < 36 && Math.abs(vehicle.y - (player.y - 20)) < 46){
        burst(player.x - camX, player.y - 24, '#ff6060', 24);
        popup(vehicle.skin === 'car' ? '汽车撞来了！' : '快艇撞来了！', '#ff6060', true);
        die(vehicle.skin === 'car' ? 'car' : 'boat');
      }
    }
  }

  // 限时模式倒计时
  if(mode === 'timed' && state !== STATE.READY && state !== STATE.DEAD){
    timeLeft -= dt;
    timerEl.textContent = Math.ceil(timeLeft);
    timerEl.style.color = timeLeft <= 10 ? '#ff5a5a' : '#455a75';
    if(timeLeft <= 0){
      timeLeft = 0;
      timerEl.textContent = '0';
      die('time');
    }
  }

  if(state === STATE.DEAD){
    deadT += dt;
    player.vy += G * dt;
    player.y += player.vy * dt;
    player.rot += 3.5 * dt;
    if(deadT > 1.1){
      finScore.textContent = score;
      finJumps.textContent = jumps;
      finBest.textContent = Math.max(best, score);
      finPerfects.textContent = perfects;
      finCombo.textContent = maxCombo;
      finCoins.textContent = '+' + (coins - coinsAtStart);
      overlayTitle.textContent = DIE_TITLES[diedBy] || '跳空了！';
      overlaySub.textContent = DIE_SUBS[diedBy] || DIE_SUBS.fall;
      overlayHint.textContent = DIE_HINTS[(Math.random() * DIE_HINTS.length) | 0];
      overlay.classList.add('show');
      showSubmitRow();
      cardDataUrl = makeCardDataUrl();
      cardImg.src = cardDataUrl;
      cardImg.style.display = 'block';
    }
  }

  // 相机跟随
  const targetCam = Math.max(0, player.x - W*0.42);
  camX += (targetCam - camX) * Math.min(1, dt*8);

  // 飘字
  for(let i = popups.length-1; i >= 0; i--){
    const p = popups[i];
    p.t += dt; p.y -= 38*dt;
    if(p.t > 1.1) popups.splice(i, 1);
  }
  // 粒子
  for(let i = particles.length-1; i >= 0; i--){
    const p = particles[i];
    p.t += dt;
    p.vy += 500 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if(p.t > p.life) particles.splice(i, 1);
  }
}

/* ---------------- 渲染 ---------------- */
function drawSky(){
  // 黑暗恐怖夜色
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d0a1e');
  g.addColorStop(0.55, '#1b1333');
  g.addColorStop(0.85, '#2b1e3d');
  g.addColorStop(1, '#382744');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 星空（双绘制无缝循环，防背景断片）
  const starSpan = W + 80;
  for(let i = 0; i < 45; i++){
    let sx = (((i * 173.7) % 1) * starSpan - camX * 0.08) % starSpan;
    if(sx < 0) sx += starSpan;
    const sy = (((i * 97.3) % 1) * 0.52) * H;
    const tw = 0.3 + 0.35 * Math.sin(gameT * 1.7 + i * 0.61);
    ctx.globalAlpha = tw;
    ctx.fillStyle = (i % 3 === 0) ? '#cfd8ff' : '#8f96c8';
    for(const ox of [0, -starSpan, starSpan]){
      const x = sx + ox;
      if(x < -10 || x > W + 10) continue;
      ctx.beginPath();
      ctx.arc(x, sy, 0.7 + (i % 3) * 0.45, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // 暗云（双绘制无缝）
  for(let i = 0; i < 6; i++){
    const span = W + 320;
    let sx = ((i * 431 + 140 - camX * (0.12 + i * 0.025)) % span + span) % span - 160;
    const by = 26 + i * 56;
    const bw = 110 + (i % 4) * 62;
    ctx.fillStyle = 'rgba(26,18,48,.5)';
    for(const ox of [0, -span, span]){
      const x = sx + ox;
      if(x + bw < -20 || x > W + 20) continue;
      ctx.beginPath();
      ctx.ellipse(x, by, bw, 20, 0, 0, Math.PI*2);
      ctx.ellipse(x + bw*0.4, by - 12, bw*0.55, 16, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }
  // 红月（坤坤愤怒的脸）
  if(redMoon) drawRedMoon();
  // 红月全局泛红 + 暗角
  if(redMoon){
    const rg = ctx.createLinearGradient(0, 0, 0, H);
    rg.addColorStop(0, 'rgba(255,40,40,.22)');
    rg.addColorStop(0.55, 'rgba(140,10,30,.08)');
    rg.addColorStop(1, 'rgba(0,0,0,.30)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawRedMoon(){
  const mx = W * 0.76 - camX * 0.02;
  const my = H * 0.2;
  const R = Math.max(46, Math.min(W, H) * 0.105);
  // 呼吸光晕
  const pu = 0.45 + 0.15 * Math.sin(gameT * 2.4);
  const halo = ctx.createRadialGradient(mx, my, R*0.4, mx, my, R*2.4);
  halo.addColorStop(0, 'rgba(255,60,50,' + pu.toFixed(2) + ')');
  halo.addColorStop(1, 'rgba(255,60,50,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(mx, my, R*2.4, 0, Math.PI*2); ctx.fill();
  // 月亮本体
  const mg = ctx.createRadialGradient(mx - R*0.3, my - R*0.3, R*0.15, mx, my, R);
  mg.addColorStop(0, '#ff7260');
  mg.addColorStop(0.6, '#e03030');
  mg.addColorStop(1, '#7a1010');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, my, R, 0, Math.PI*2); ctx.fill();
  // 愤怒的坤坤脸
  const f = R / 58;
  ctx.strokeStyle = '#2b0707'; ctx.fillStyle = '#2b0707';
  ctx.lineWidth = 3.6 * f; ctx.lineCap = 'round';
  // 中分头发轮廓（愤怒蹙眉版）
  ctx.beginPath();
  ctx.arc(mx, my - 6*f, R*0.92, Math.PI*1.08, Math.PI*1.92);
  ctx.stroke();
  // V形怒眉
  ctx.beginPath();
  ctx.moveTo(mx - 31*f, my - 16*f);
  ctx.lineTo(mx - 13*f, my - 7*f);
  ctx.moveTo(mx + 31*f, my - 16*f);
  ctx.lineTo(mx + 13*f, my - 7*f);
  ctx.stroke();
  // 眼睛（白底红瞳）
  ctx.fillStyle = '#fdf3f3';
  ctx.beginPath(); ctx.ellipse(mx - 21*f, my - 2*f, 10*f, 11.5*f, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(mx + 21*f, my - 2*f, 10*f, 11.5*f, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#c00e0e';
  ctx.beginPath(); ctx.arc(mx - 19*f, my - 1*f, 5.2*f, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 23*f, my - 1*f, 5.2*f, 0, Math.PI*2); ctx.fill();
  // 嘴（愤怒下弯）
  ctx.beginPath();
  ctx.arc(mx, my + 24*f, 15*f, Math.PI*1.12, Math.PI*1.88);
  ctx.stroke();
  // 怒汗珠
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(mx - 40*f, my + 10*f, 3*f, 5.5*f, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(mx + 40*f, my + 18*f, 3*f, 5.5*f, 0, 0, Math.PI*2); ctx.fill();
}

function drawGround(){
  const g = ctx.createLinearGradient(0, groundY, 0, H);
  g.addColorStop(0, '#251a3a');
  g.addColorStop(1, '#130d22');
  ctx.fillStyle = g;
  ctx.fillRect(0, groundY, W, H - groundY);
  // 顶部发光边缘
  ctx.fillStyle = 'rgba(143,107,255,.4)';
  ctx.fillRect(0, groundY, W, 2);
  // 地面暗纹（世界坐标无缝，防断片）
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  const span = W + 240;
  for(let i = 0; i < 14; i++){
    let sx = ((i * 271 + 40 - camX) % span + span) % span - 120;
    const sy = groundY + 18 + (i % 4) * 24;
    for(const ox of [0, -span, span]){
      const x = sx + ox;
      if(x < -60 || x > W + 60) continue;
      ctx.beginPath();
      ctx.ellipse(x, sy, 26 + (i % 3) * 15, 7, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

function drawFog(){
  // 底部雾（渐变 + 漂移雾层）
  const g = ctx.createLinearGradient(0, groundY - 60, 0, H);
  g.addColorStop(0, 'rgba(16,10,28,0)');
  g.addColorStop(1, 'rgba(16,10,28,.9)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(120,90,180,.07)';
  const span = W + 400;
  for(let i = 0; i < 6; i++){
    let sx = ((i * 389 + 80 - camX * 0.3) % span + span) % span - 200;
    const sy = groundY + 10 + (i % 3) * 26;
    for(const ox of [0, -span, span]){
      const x = sx + ox;
      if(x < -120 || x > W + 120) continue;
      ctx.beginPath();
      ctx.ellipse(x, sy, 150 + (i % 3) * 90, 26 + (i % 2) * 14, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)&255, gg = (n>>8)&255, b = n&255;
  r = Math.max(0, Math.min(255, r + amt*255));
  gg = Math.max(0, Math.min(255, gg + amt*255));
  b = Math.max(0, Math.min(255, b + amt*255));
  return 'rgb(' + (r|0) + ',' + (gg|0) + ',' + (b|0) + ')';
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const BOX_STYLES = {
  normal:  { top:'#403858', front:'#2a2340', glow:'rgba(143,107,255,.85)', vein:'rgba(143,107,255,.13)' },
  spring:  { top:'#25523d', front:'#173426', glow:'rgba(62,240,138,.9)',  vein:'rgba(62,240,138,.16)' },
  cracked: { top:'#4d3c2a', front:'#35291c', glow:'rgba(255,90,60,.75)', vein:'rgba(255,90,60,.12)' },
  coin:    { top:'#514017', front:'#382c0e', glow:'rgba(255,215,0,.9)',  vein:'rgba(255,215,0,.14)' }
};

function drawBox(b){
  let x = b.x - camX, w = b.w;
  let yOff = 0, rot = 0;
  if(b.dead){
    yOff = b.fallY;
    rot = b.rot;
  }
  if(x + w < -20 || x > W + 20) return;
  const st = BOX_STYLES[b.type] || BOX_STYLES.normal;
  ctx.save();
  if(rot){
    ctx.translate(x + w/2, topY + (groundY - topY)/2);
    ctx.rotate(rot);
    ctx.translate(-(x + w/2), -(topY + (groundY - topY)/2));
  }
  if(b.dead) ctx.globalAlpha = Math.max(0, 1 - b.fallT * 0.9);
  // 侧面（暗石 + 竖向能量纹）
  const g = ctx.createLinearGradient(0, topY, 0, groundY);
  g.addColorStop(0, st.front);
  g.addColorStop(1, shade(st.front, -0.28));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x + w*0.06, topY + yOff);
  ctx.lineTo(x + w*0.94, topY + yOff);
  ctx.lineTo(x + w, groundY + yOff);
  ctx.lineTo(x, groundY + yOff);
  ctx.closePath();
  ctx.fill();
  // 竖向裂纹能量线
  ctx.strokeStyle = st.vein;
  ctx.lineWidth = 2;
  for(let i = 1; i <= 3; i++){
    const vx = x + w * (0.14 + i * 0.24);
    const bend = (i % 2) ? 4 : -4;
    ctx.beginPath();
    ctx.moveTo(vx, topY + yOff + 22);
    ctx.lineTo(vx + bend * 0.5, (topY + groundY)/2 + yOff);
    ctx.lineTo(vx - bend, groundY + yOff - 8);
    ctx.stroke();
  }
  // 底部辉光
  ctx.fillStyle = st.vein;
  ctx.fillRect(x + 2, groundY + yOff - 3, w - 4, 3);
  // 顶面（亮石 + 双层伪辉光描边，性能友好）
  ctx.fillStyle = st.top;
  roundRect(x, topY + yOff, w, 26, 9);
  ctx.fill();
  ctx.strokeStyle = st.glow;
  ctx.lineWidth = 2.5;
  roundRect(x + 1, topY + yOff + 1, w - 2, 24, 8);
  ctx.stroke();
  ctx.globalAlpha = 0.28;
  ctx.lineWidth = 6;
  roundRect(x + 1, topY + yOff + 1, w - 2, 24, 8);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // 顶面斜向高光
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  roundRect(x + 5, topY + yOff + 4, w - 10, 7, 4);
  ctx.fill();
  const cx = x + w/2;
  // 中心标定（发光菱形）
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath();
  ctx.moveTo(cx, topY + yOff + 15);
  ctx.lineTo(cx + 5, topY + yOff + 21);
  ctx.lineTo(cx, topY + yOff + 27);
  ctx.lineTo(cx - 5, topY + yOff + 21);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = st.glow;
  ctx.beginPath();
  ctx.moveTo(cx, topY + yOff + 14);
  ctx.lineTo(cx + 6, topY + yOff + 21);
  ctx.lineTo(cx, topY + yOff + 28);
  ctx.lineTo(cx - 6, topY + yOff + 21);
  ctx.closePath();
  ctx.fill();
  // 目标台子：金色 PERFECT 区（脉冲）
  if(b === player.targetBox && state !== STATE.READY && state !== STATE.DEAD){
    const pz = perfectZone(b);
    const a = 0.55 + 0.3 * Math.sin(gameT * 7);
    ctx.fillStyle = 'rgba(255,215,0,' + a.toFixed(2) + ')';
    roundRect(cx - pz, topY + yOff + 14, pz*2, 9, 4);
    ctx.fill();
  }
  // 特殊台子标记
  if(b.type === 'coin'){
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('💰', cx, topY + yOff - 8);
  } else if(b.type === 'spring'){
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath();
    ctx.moveTo(cx - 9, topY + yOff + 12);
    ctx.lineTo(cx + 9, topY + yOff + 12);
    ctx.lineTo(cx, topY + yOff - 4);
    ctx.closePath();
    ctx.fill();
    // 弹簧线圈
    ctx.strokeStyle = st.glow;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 5, topY + yOff + 20);
    ctx.quadraticCurveTo(cx + 5, topY + yOff + 22, cx - 5, topY + yOff + 25);
    ctx.stroke();
  } else if(b.type === 'cracked'){
    ctx.strokeStyle = 'rgba(30,16,8,.8)';
    ctx.lineWidth = 2;
    const fy = (topY + groundY) / 2;
    ctx.beginPath();
    ctx.moveTo(cx - 12, topY + yOff + 28);
    ctx.lineTo(cx - 5, fy - 16);
    ctx.lineTo(cx + 7, fy + 4);
    ctx.lineTo(cx + 1, fy + 26);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 7, topY + yOff + 28);
    ctx.lineTo(cx + 13, fy - 6);
    ctx.stroke();
  }
  // 葵菜陷阱（愤怒向日葵）
  if(b.plant){
    const px = x + b.plant.x;
    ctx.strokeStyle = '#3e8e3a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(px, topY + yOff + 22); ctx.lineTo(px, topY + yOff + 2); ctx.stroke();
    ctx.fillStyle = '#4fa84a';
    ctx.beginPath(); ctx.ellipse(px - 6, topY + yOff + 10, 6, 3, -0.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px + 6, topY + yOff + 14, 6, 3, 0.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd23e';
    for(let i = 0; i < 8; i++){
      const a = (i / 8) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(px + Math.cos(a) * 6, topY + yOff - 2 + Math.sin(a) * 6, 3.4, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#5b3a10';
    ctx.beginPath(); ctx.arc(px, topY + yOff - 2, 4.5, 0, Math.PI*2); ctx.fill();
    // 愤怒小脸
    ctx.fillStyle = '#ffd23e';
    ctx.beginPath(); ctx.arc(px - 1.6, topY + yOff - 3, 1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(px + 1.6, topY + yOff - 3, 1, 0, Math.PI*2); ctx.fill();
  }
  if(b.moving){
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⇄', cx, (topY + groundY) / 2 + yOff + 5);
    // 移动方向光点
    ctx.fillStyle = st.glow;
    ctx.beginPath();
    ctx.arc(x + 4, topY + yOff + 10, 2.5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w - 4, topY + yOff + 10, 2.5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPlayer(){
  const px = player.x - camX;
  const py = player.y - P_H * player.sy * 0.5;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(player.rot);
  ctx.scale(player.sx, player.sy);
  // 影子
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, P_H*0.5, P_W*0.34, 6, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  if(skin === 'ball'){
    drawBasketball();
  } else if(skin === 'gold'){
    drawGoldenChicken();
  } else if(skin === 'hei'){
    drawBlackChicken();
  } else if(spriteImg.complete && spriteImg.naturalWidth > 0){
    ctx.drawImage(spriteImg, -P_W/2, -P_H/2, P_W, P_H);
  } else {
    ctx.fillStyle = '#e0688a';
    ctx.beginPath();
    ctx.arc(0, -4, 12, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(-8, 8, 16, 20);
  }
  ctx.restore();
}

// 篮球小子：篮球 + 表情 + 小短腿
function drawBasketball(){
  ctx.fillStyle = '#e8732a';
  ctx.beginPath(); ctx.arc(0, 2, 15, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#5b2c0e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 2, 15, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-15, 2); ctx.lineTo(15, 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(0, 17); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 2, 10, -Math.PI*0.35, Math.PI*0.35); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 2, 10, Math.PI*0.65, Math.PI*1.35); ctx.stroke();
  // 表情：眼睛
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-5.5, -1.5, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.5, -1.5, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2b1506';
  ctx.beginPath(); ctx.arc(-5.5, -1, 1.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.5, -1, 1.6, 0, Math.PI*2); ctx.fill();
  // 微笑
  ctx.strokeStyle = '#2b1506'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 3.5, 5, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
  // 腮红
  ctx.fillStyle = 'rgba(255,150,120,.5)';
  ctx.beginPath(); ctx.arc(-9, 2, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(9, 2, 2.2, 0, Math.PI*2); ctx.fill();
  // 小短腿
  ctx.strokeStyle = '#c25a1e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-6, 16); ctx.lineTo(-8, 24); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, 16); ctx.lineTo(8, 24); ctx.stroke();
  ctx.fillStyle = '#c25a1e';
  ctx.beginPath(); ctx.ellipse(-8.5, 24.5, 3.2, 2, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8.5, 24.5, 3.2, 2, 0, 0, Math.PI*2); ctx.fill();
}

// 鸡系皮肤共用画法（调色板参数化）
function drawChicken(p){
  // 尾羽
  ctx.strokeStyle = p.tail; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-7, -6); ctx.quadraticCurveTo(-17, -12, -15, -20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-9, -3); ctx.quadraticCurveTo(-21, -6, -20, -14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6, -8); ctx.quadraticCurveTo(-13, -16, -10, -23); ctx.stroke();
  // 身体
  ctx.fillStyle = p.body;
  ctx.beginPath(); ctx.ellipse(0, 6, 13, 16, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = p.shade;
  ctx.beginPath(); ctx.ellipse(3, 12, 10, 9, 0, 0, Math.PI*2); ctx.fill();
  // 翅膀
  ctx.fillStyle = p.wing;
  ctx.beginPath(); ctx.ellipse(-6, 4, 7, 11, -0.35, 0, Math.PI*2); ctx.fill();
  // 羽毛斑点 / 高光
  ctx.fillStyle = p.spot;
  if(p.spotDots){
    ctx.beginPath(); ctx.arc(-2, 1, 1.7, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(2, 8, 1.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-5, 6, 1.1, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(-4, -2, 4, 6, -0.3, 0, Math.PI*2); ctx.fill();
  }
  // 头
  ctx.fillStyle = p.head;
  ctx.beginPath(); ctx.arc(8, -11, 9.5, 0, Math.PI*2); ctx.fill();
  // 鸡冠
  ctx.fillStyle = p.comb;
  ctx.beginPath(); ctx.arc(11, -20, 4.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5, -22, 3.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(14, -16, 2.6, 0, Math.PI*2); ctx.fill();
  // 喙
  ctx.fillStyle = p.beak;
  ctx.beginPath(); ctx.moveTo(16, -12); ctx.lineTo(23, -9); ctx.lineTo(16, -6); ctx.closePath(); ctx.fill();
  // 眼睛（乌鸡白底黑瞳，金鸡深瞳+高光）
  if(p.eyeWhite){
    ctx.fillStyle = p.eyeWhite;
    ctx.beginPath(); ctx.arc(11, -13, 2.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = p.eye;
  ctx.beginPath(); ctx.arc(11, -13, p.eyeR, 0, Math.PI*2); ctx.fill();
  if(p.eyeSpark){
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(11.7, -13.6, 0.7, 0, Math.PI*2); ctx.fill();
  }
  // 腿
  ctx.strokeStyle = p.leg; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-2, 20); ctx.lineTo(-2, 27); ctx.lineTo(-7, 29); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4, 20); ctx.lineTo(4, 27); ctx.lineTo(9, 29); ctx.stroke();
}

const GOLD_CHICKEN = {
  tail:'#ff9f1c', body:'#ffc800', shade:'rgba(214,140,0,.4)', wing:'#ffb400',
  spot:'rgba(255,255,255,.55)', spotDots:false,
  head:'#ffd94d', comb:'#ff5a3c', beak:'#ff9f1c', leg:'#e8732a',
  eye:'#4a2508', eyeR:1.9, eyeSpark:true
};

const BLACK_CHICKEN = {
  tail:'#1a1a24', body:'#33333f', shade:'rgba(0,0,0,.35)', wing:'#26262f',
  spot:'rgba(255,255,255,.75)', spotDots:true,
  head:'#3d3d4a', comb:'#ff5a3c', beak:'#ff9f1c', leg:'#ff9f1c',
  eye:'#111', eyeR:1.3, eyeWhite:'#fff', eyeSpark:false
};

// 金色鸡
function drawGoldenChicken(){ drawChicken(GOLD_CHICKEN); }
// 乌鸡（黑子）
function drawBlackChicken(){ drawChicken(BLACK_CHICKEN); }

function drawAimGuide(){
  if(state !== STATE.CHARGE) return;
  const px = player.x - camX;
  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.strokeStyle = 'rgba(95,168,224,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px, topY - 24);
  ctx.lineTo(px, groundY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawPopups(){
  for(const p of popups){
    const a = Math.max(0, 1 - p.t/1.1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate((p.t * 0.4) - 0.15);
    ctx.font = (p.big ? 'bold 34px' : 'bold 18px') + ' "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of particles){
    const a = Math.max(0, 1 - p.t / p.life);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawChargeBar(){
  if(state !== STATE.CHARGE) return;
  const c = Math.min(charge, 1);
  const px = player.x - camX;
  const bw = 46;
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  roundRect(px - bw/2, player.y - P_H - 26, bw, 8, 4);
  ctx.fill();
  ctx.fillStyle = c >= 1 ? '#ff5a5a' : '#ffb64d';
  roundRect(px - bw/2, player.y - P_H - 26, bw * c, 8, 4);
  ctx.fill();
}

function render(){
  drawSky();
  drawGround();
  drawFog();
  for(const b of boxes) drawBox(b);
  drawPlayer();
  drawLion();
  drawFans();
  drawLetters();
  drawPlayerBullets();
  drawLionBullets();
  drawVehicle();
  drawParticles();
  drawPopups();
  drawAimGuide();
  drawChargeBar();
  if(flashT > 0){
    ctx.fillStyle = 'rgba(255,30,30,' + (flashT / 0.7 * 0.3).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawLion(){
  if(!lion) return;
  const lx = lion.x - camX;
  if(lion.dead){
    const a = Math.max(0, 1 - lion.deadT * 2.2);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(lx, topY);
    ctx.rotate(lion.deadT * 3);
    ctx.scale(1, 1 + lion.deadT * 2);
    drawLionBody(lion.big);
    ctx.restore();
    return;
  }
  const bob = Math.sin(gameT * 4 + lion.wob) * 2;
  ctx.save();
  ctx.translate(lx, topY - bob);
  drawLionBody(lion.big);
  ctx.restore();
  // HP 条
  const bw = lion.big ? 64 : 40;
  const hy = topY - (lion.big ? 86 : 68);
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  roundRect(lx - bw/2, hy, bw, 7, 3);
  ctx.fill();
  ctx.fillStyle = lion.big ? '#ff5050' : '#ffb400';
  roundRect(lx - bw/2, hy, bw * (lion.hp / lion.maxHp), 7, 3);
  ctx.fill();
}

function drawLionBody(big){
  const s = big ? 1.6 : 1;
  // 金色鬃毛
  ctx.fillStyle = big ? '#ffb400' : '#f0a030';
  for(let i = 0; i < 10; i++){
    const a = (i / 10) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * 15 * s, -20 * s + Math.sin(a) * 15 * s, 6 * s, 0, Math.PI*2);
    ctx.fill();
  }
  // 身体
  ctx.fillStyle = '#e8a020';
  ctx.beginPath(); ctx.ellipse(0, 4 * s, 16 * s, 13 * s, 0, 0, Math.PI*2); ctx.fill();
  // 头
  ctx.fillStyle = '#f2b43a';
  ctx.beginPath(); ctx.arc(0, -20 * s, 12 * s, 0, Math.PI*2); ctx.fill();
  // 怒眉 + 眼
  ctx.strokeStyle = '#5b2c0e'; ctx.lineWidth = 2.5 * s; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-8*s, -26*s); ctx.lineTo(-3*s, -22*s);
  ctx.moveTo(8*s, -26*s); ctx.lineTo(3*s, -22*s);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-5*s, -20*s, 3*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5*s, -20*s, 3*s, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3a1c06';
  ctx.beginPath(); ctx.arc(-4.5*s, -19.5*s, 1.6*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.5*s, -19.5*s, 1.6*s, 0, Math.PI*2); ctx.fill();
  // 嘴
  ctx.strokeStyle = '#5b2c0e'; ctx.lineWidth = 2 * s;
  ctx.beginPath();
  ctx.arc(0, -13*s, 4*s, Math.PI*0.2, Math.PI*0.8);
  ctx.stroke();
  // 小短腿
  ctx.strokeStyle = '#b87a14'; ctx.lineWidth = 3 * s;
  ctx.beginPath(); ctx.moveTo(-8*s, 14*s); ctx.lineTo(-10*s, 22*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8*s, 14*s); ctx.lineTo(10*s, 22*s); ctx.stroke();
  // 精英王冠
  if(big){
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(-9*s, -34*s); ctx.lineTo(-9*s, -42*s); ctx.lineTo(-5*s, -37*s);
    ctx.lineTo(-1*s, -44*s); ctx.lineTo(3*s, -37*s); ctx.lineTo(7*s, -42*s); ctx.lineTo(7*s, -34*s);
    ctx.closePath();
    ctx.fill();
  }
}

function drawPlayerBullets(){
  for(const b of playerBullets){
    const x = b.x - camX;
    ctx.save();
    ctx.translate(x, b.y);
    ctx.rotate(b.rot);
    ctx.fillStyle = '#e8732a';
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#5b2c0e'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, 9); ctx.stroke();
    ctx.restore();
  }
}

function drawLionBullets(){
  for(const b of lionBullets){
    const x = b.x - camX;
    ctx.save();
    ctx.translate(x, b.y);
    ctx.rotate(b.rot);
    ctx.fillStyle = '#ff5a3c';
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#7a1400'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();
    ctx.fillStyle = '#7a1400';
    ctx.beginPath(); ctx.arc(-3, -2, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -2, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawVehicle(){
  if(!vehicle) return;
  const x = vehicle.x, y = vehicle.y;
  ctx.save();
  ctx.translate(x, y);
  if(vehicle.warnT > 0){
    const w = 0.5 + 0.5 * Math.sin(gameT * 14);
    ctx.fillStyle = 'rgba(255,80,50,' + w.toFixed(2) + ')';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚠', 0, -44);
  }
  if(vehicle.skin === 'car'){
    ctx.fillStyle = '#d92b2b';
    roundRect(-30, -18, 60, 22, 6); ctx.fill();
    ctx.fillStyle = '#a81e1e';
    roundRect(-8, -28, 26, 14, 5); ctx.fill();
    ctx.fillStyle = '#9ad8ff';
    roundRect(-4, -25, 12, 9, 3); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-16, 6, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(16, 6, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(vehicle.dir > 0 ? 31 : -31, -8, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('汽运', 0, -2);
  } else {
    ctx.fillStyle = '#2b7dd9';
    ctx.beginPath();
    ctx.moveTo(-34, -6); ctx.lineTo(34, -6); ctx.lineTo(24, 10); ctx.lineTo(-24, 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#1c5aa8'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-34, -6); ctx.lineTo(34, -6); ctx.lineTo(24, 10); ctx.lineTo(-24, 10);
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#f0f0f0';
    roundRect(-4, -20, 22, 16, 3); ctx.fill();
    ctx.fillStyle = '#ff5050';
    ctx.beginPath(); ctx.moveTo(18, -20); ctx.lineTo(18, -32); ctx.lineTo(28, -27); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#666'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(18, -20); ctx.lineTo(18, -32); ctx.stroke();
    ctx.strokeStyle = 'rgba(154,216,255,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-30, 12); ctx.quadraticCurveTo(-24, 16, -18, 12); ctx.quadraticCurveTo(-12, 8, -6, 12); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('开艇', 8, -4);
  }
  ctx.restore();
}

function drawFans(){
  for(const f of fans){
    const fx = f.x - camX;
    const bob = Math.sin(gameT * 6 + f.t * 8) * 3;
    ctx.save();
    ctx.translate(fx, f.y + bob);
    // 真爱粉（暗色小人 + 应援棒 + 爱心）
    ctx.fillStyle = '#1c1530';
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(-7, 6, 14, 14);
    ctx.strokeStyle = '#ff6b9d'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(6, 10); ctx.lineTo(13, 18); ctx.stroke();
    ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('💗', 0, -12);
    const w = 0.6 + 0.4 * Math.sin(gameT * 12);
    ctx.fillStyle = 'rgba(255,60,80,' + w.toFixed(2) + ')';
    ctx.font = 'bold 10px sans-serif';
    ctx.fillText('⚠', 0, -26);
    ctx.restore();
  }
}

function drawLetters(){
  for(const l of letters){
    const lx = l.x - camX;
    ctx.save();
    ctx.translate(lx, l.y);
    ctx.rotate(l.rot);
    // 红光拖尾
    const tr = ctx.createLinearGradient(0, -44, 0, 14);
    tr.addColorStop(0, 'rgba(255,60,60,0)');
    tr.addColorStop(1, 'rgba(255,60,60,.38)');
    ctx.fillStyle = tr;
    ctx.fillRect(-12, -44, 24, 58);
    // 律师函字样
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('律师函', 0, -14);
    // 信封
    ctx.fillStyle = '#f5ead6';
    ctx.beginPath();
    if(ctx.roundRect){ ctx.roundRect(-16, -12, 32, 24, 3); } else { ctx.rect(-16, -12, 32, 24); }
    ctx.fill();
    // 封口折线
    ctx.strokeStyle = '#c9b896'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-16, -12); ctx.lineTo(0, 2); ctx.lineTo(16, -12); ctx.stroke();
    // 红印章
    ctx.fillStyle = '#e02020';
    ctx.beginPath(); ctx.arc(0, 6, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 7px sans-serif';
    ctx.fillText('函', 0, 8.5);
    ctx.restore();
  }
}

/* ---------------- 主循环 ---------------- */
function loop(ts){
  const dt = (ts - last) / 1000;
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

const spriteImg = new Image();
spriteImg.src = 'cxk.png';

resize();
newGame();
state = STATE.READY;
modeTagEl.textContent = MODES[mode].label;
coinEl.textContent = '💰 ' + coins;
startCoinsEl.textContent = coins;
requestAnimationFrame(function(ts){ last = ts; requestAnimationFrame(loop); });

// 测试/调试钩子
window.__game = {
  get state(){ return state; },
  get player(){ return player; },
  get boxes(){ return boxes; },
  get score(){ return score; },
  get jumps(){ return jumps; },
  get mode(){ return mode; },
  get maxDist(){ return MAX_DIST; },
  get perfectZone(){ return perfectZone; },
  get perfects(){ return perfects; },
  get combo(){ return combo; },
  get mult(){ return mult; },
  get maxCombo(){ return maxCombo; },
  get coins(){ return coins; },
  get diedBy(){ return diedBy; },
  get timeLeft(){ return timeLeft; },
  get redMoon(){ return redMoon; },
  get fans(){ return fans; },
  get letters(){ return letters; },
  get camX(){ return camX; },
  get lion(){ return lion; },
  get lionBullets(){ return lionBullets; },
  get playerBullets(){ return playerBullets; },
  get vehicle(){ return vehicle; },
  get moveLeft(){ return moveLeft; },
  get moveRight(){ return moveRight; },
  fire: function(){ fire(); },
  setMove: function(l, r){ moveLeft = !!l; moveRight = !!r; },
  setMode: function(m){ mode = m; newGame(); state = STATE.READY; },
  start: function(){ startGame(); },
  press: function(){ press({ preventDefault(){} }); },
  release: function(){ release({ preventDefault(){} }); },
  reset: function(){ newGame(); }
};
})();
</script>
