<script>
(function(){
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const jumpsEl = document.getElementById('jumps');
const bestEl = document.getElementById('best');
const coinEl = document.getElementById('coinEl');

const sJump = document.getElementById('sJump');
const sFail = document.getElementById('sFail');
const sBgm = document.getElementById('sBgm');
const soundBtn = document.getElementById('soundBtn');

// 公网分享地址
const SHARE_URL = 'https://lxoai.github.io/cxk-jump/';

let W = 0, H = 0, DPR = 1;
let groundY = 0, topY = 0;
let gameT = 0;
let best = +(localStorage.getItem('cxk_jump_best') || 0);
bestEl.textContent = '最高 ' + best;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  groundY = H * 0.80;
  topY = groundY - 130;
}
window.addEventListener('resize', resize);

/* ---------------- 物理常量 ---------------- */
const G = 2600;          // 重力 px/s^2
const VY0 = 1150;        // 起跳初速度
const CHARGE_TIME = 0.9; // 蓄力满所需秒数
const MAX_VX = 440;      // 最大水平速度
const P_W = 44, P_H = 58;// 角色尺寸
const MAX_DIST = MAX_VX * (2 * VY0 / G); // 满蓄力最远水平距离 ≈ 389
const LAND_PAD = 24;     // 落地判定宽容（角色中心距方块边缘）

const STATE = { READY:0, IDLE:1, CHARGE:2, FLY:3, DEAD:4 };
let state = STATE.READY;
let score = 0, jumps = 0, charge = 0, holdT = 0, deadT = 0;
let combo = 0, mult = 1, perfects = 0, maxCombo = 0;
let coins = +(localStorage.getItem('cxk_coins') || 0);
let coinsAtStart = 0;
let camX = 0, timeLeft = 0, diedBy = 'fall';
let cardDataUrl = '';
let popups = [], particles = [];

const player = { x:0, y:0, vx:0, vy:0, rot:0, sx:1, sy:1, targetBox:null, landed:false, standingBox:null };

const boxes = [];
const COLORS = [
  ['#f9a8c4','#f472a0'], ['#a7d8f9','#5fa8e0'], ['#b8e6b0','#7bc97f'],
  ['#f9e08a','#f0b83a'], ['#d4b8f0','#a87de0'], ['#f7b57a','#ef8f3f'],
  ['#9ee8dd','#4fc4b4'], ['#f2a2a2','#e06a6a']
];

const MEMES = ['鸡你太美','你干嘛～','小黑子','唱跳Rap篮球','坤坤加油','铁山靠','只因你太美','篮球梦'];
const MILESTONE = ['鸡你太美！','太美了！','坤坤附体','封神了','无敌了'];
const DIE_TITLES = { fall:'跳空了！', crack:'踩碎了！', slide:'被甩下去了！', time:'时间到！' };
const DIE_SUBS = { fall:'你干嘛～ 哈哈哎哟', crack:'碎台子不是好惹的…', slide:'移动台子会甩人！', time:'60 秒结束，跳得不错嘛' };

const MODES = {
  classic: { label:'🎮 经典模式' },
  timed:   { label:'⏱ 限时60秒' },
  speedy:  { label:'⚡ 极速模式' },
  daily:   { label:'📅 每日挑战' }
};

const SKINS = [
  { id:'kun',  name:'坤坤',   ico:'🕺', price:0 },
  { id:'hei',  name:'黑子',   ico:'🖤', price:100 },
  { id:'ball', name:'篮球',   ico:'🏀', price:300 },
  { id:'gold', name:'金坤坤', ico:'✨', price:600 }
];
let owned = (localStorage.getItem('cxk_skins') || 'kun').split(',');
let skin = localStorage.getItem('cxk_skin') || 'kun';
if(!owned.includes(skin)) skin = 'kun';

/* ---------------- 随机数（每日模式用种子） ---------------- */
let rng = Math.random;
function rnd(a,b){ return a + rng()*(b-a); }
function pick(arr){ return arr[(rng()*arr.length)|0]; }
function hashStr(s){
  let h = 1779033703 ^ s.length;
  for(let i = 0; i < s.length; i++){
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function dateStr(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

/* ---------------- 模式与方块生成 ---------------- */
let mode = 'classic';

function genParams(){
  const s = score;
  if(mode === 'speedy'){
    const d = Math.min(s * 1.9, 70);
    return { wMin: 84 - d*0.85, wMax: 132 - d*0.85, gapMin: 40 + d*1.2, gapMax: Math.min(120 + d*0.6, 128) };
  }
  const d = Math.min(s, 40);
  const gapCap = mode === 'timed' ? 165 : 160;
  return { wMin: 84 - d*0.7, wMax: 132 - d*0.7, gapMin: 40 + d*1.6, gapMax: Math.min(148 + d*1.6, gapCap) };
}

function makeBox(baseX, w, type, moving){
  const c = pick(COLORS);
  const b = { baseX:baseX, x:baseX, w:w, type:type, moving:moving, top:c[0], front:c[1], canPerfect:true };
  if(type === 'spring'){ b.top = '#b6f2a8'; b.front = '#67cf57'; b.canPerfect = false; }
  if(type === 'cracked'){ b.top = '#cfc3b4'; b.front = '#a89b8a'; }
  if(moving){
    b.range = rnd(18, 32);
    b.spd = rnd(0.9, 1.5);
    b.phase = rng() * Math.PI * 2;
    b.prevX = baseX;
  }
  return b;
}

function spawnNext(){
  const last = boxes[boxes.length - 1];
  const p = genParams();
  const w = rnd(p.wMin, p.wMax);
  const gap = rnd(p.gapMin, p.gapMax);
  const idx = boxes.length;
  let type = 'normal';
  if(idx >= 3){
    const r = rng();
    if(r < 0.10) type = 'spring';
    else if(r < 0.21) type = 'cracked';
    else if(r < 0.33) type = 'coin';
  }
  let moving = false;
  if(idx >= 3 && type === 'normal' && gap >= 70 && rng() < 0.15) moving = true;
  const baseX = (last.moving ? last.baseX : last.x) + last.w + gap;
  boxes.push(makeBox(baseX, w, type, moving));
}

function newGame(){
  boxes.length = 0; popups.length = 0; particles.length = 0;
  if(mode === 'daily') rng = mulberry32(hashStr('cxk-jump-' + dateStr()));
  else rng = Math.random;
  const b0 = makeBox(0, rnd(110, 140), 'normal', false);
  boxes.push(b0);
  spawnNext(); spawnNext(); spawnNext();
  camX = 0; score = 0; jumps = 0; charge = 0; holdT = 0; deadT = 0;
  combo = 0; mult = 1; perfects = 0; maxCombo = 0;
  coinsAtStart = coins; diedBy = 'fall';
  timeLeft = 60;
  timerEl.style.display = (mode === 'timed') ? 'block' : 'none';
  timerEl.textContent = '60';
  player.x = b0.x + b0.w/2;
  player.y = topY;
  player.vx = 0; player.vy = 0; player.rot = 0; player.sx = 1; player.sy = 1;
  player.landed = false; player.standingBox = b0;
  player.targetBox = boxes[1];
  state = STATE.IDLE;
  scoreEl.textContent = '0';
  jumpsEl.textContent = '0 跳';
  coinEl.textContent = '💰 ' + coins;
  startCoinsEl.textContent = coins;
  updateComboHud();
}

/* ---------------- 音频 ---------------- */
let soundOn = true;
let actx = null;
function audioCtx(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
  return actx;
}
function tone(freq, dur, type, vol, delay){
  if(!soundOn) return;
  const a = audioCtx(); if(!a) return;
  const t0 = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function playPerfect(){ tone(880, 0.12, 'triangle', 0.16); tone(1320, 0.18, 'triangle', 0.16, 0.09); }
function playSpring(){ tone(280, 0.08, 'square', 0.11); tone(480, 0.1, 'square', 0.11, 0.07); tone(760, 0.14, 'square', 0.11, 0.14); }
function playCoin(){ tone(1046, 0.07, 'sine', 0.13); tone(1568, 0.12, 'sine', 0.13, 0.06); }
function playCrack(){ tone(170, 0.14, 'sawtooth', 0.10); tone(95, 0.2, 'sawtooth', 0.10, 0.05); }

function playFail(){ try{ if(!soundOn) return; sFail.currentTime = 0; sFail.play(); }catch(e){} }

const LB_PTR = 'https://api.github.com/repos/lxoai/cxk-jump/contents/lb.json';
const LB_API = 'https://jsonblob.com/api/jsonBlob/';
let lbId = null;
let lbTab = 'classic';
let myName = localStorage.getItem('cxk_name') || ('ikun' + (100 + ((Math.random()*900)|0)));

function esc(s){ return String(s).replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }
function isToday(ts){
  const d = new Date(ts), n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
}
function lbFilter(scores){
  return scores.filter(function(s){
    const m = s.mode || 'classic';
    if(lbTab === 'daily') return m === 'daily' && isToday(s.ts);
    return m === lbTab;
  });
}

async function getLbId(){
  const cache = localStorage.getItem('cxk_lb');
  if(cache){
    try{ const c = JSON.parse(cache); if(Date.now() - c.t < 6*3600e3) return c.id; }catch(e){}
  }
  const r = await fetch(LB_PTR, { cache: 'no-store' });
  const j = await r.json();
  const id = JSON.parse(atob(j.content)).id;
  localStorage.setItem('cxk_lb', JSON.stringify({ id: id, t: Date.now() }));
  return id;
}
async function lbRead(){
  if(!lbId) lbId = await getLbId();
  const r = await fetch(LB_API + lbId, { cache: 'no-store' });
  const j = await r.json();
  return Array.isArray(j.scores) ? j.scores : [];
}
async function lbSubmit(entry){
  if(!lbId) lbId = await getLbId();
  let scores = [];
  try { scores = await lbRead(); } catch(e){}
  scores.push(entry);
  scores.sort(function(a,b){ return (b.score - a.score) || (b.jumps - a.jumps) || (b.ts - a.ts); });
  if(scores.length > 300) scores = scores.slice(0, 300);
  const r = await fetch(LB_API + lbId, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ scores: scores })
  });
  if(!r.ok) throw new Error('write failed');
}
async function openLb(){
  document.getElementById('lbOverlay').classList.add('show');
  const list = document.getElementById('lbList');
  list.textContent = '加载中…';
  try{
    const scores = lbFilter(await lbRead());
    scores.sort(function(a,b){ return (b.score - a.score) || (b.jumps - a.jumps) || (b.ts - a.ts); });
    const top = scores.slice(0, 20);
    if(!top.length){
      list.innerHTML = '<div class="lb-empty">这个榜还没人，快来抢第一！</div>';
      return;
    }
    list.innerHTML = top.map(function(s, i){
      const medal = i===0 ? '🥇' : (i===1 ? '🥈' : (i===2 ? '🥉' : (i+1)));
      const me = (s.name === myName) ? ' me' : '';
      return '<div class="lb-item' + me + '"><span class="lb-rank ' + (i<3 ? 'g'+(i+1) : '') + '">' + medal + '</span><span class="lb-name">' + esc(s.name) + '</span><span class="lb-score">' + s.score + ' 分</span><span class="lb-jumps">' + s.jumps + ' 跳</span></div>';
    }).join('');
  }catch(e){
    list.innerHTML = '<div class="lb-empty">排行榜暂时连不上，稍后再试~</div>';
  }
}

/* ---------------- 计分 / 判定 ---------------- */
function perfectZone(box){ return Math.max(10, Math.min(18, box.w * 0.22)); }
function isPerfect(box, x){ return Math.abs(x - (box.x + box.w/2)) <= perfectZone(box); }
function addScore(pts){
  score += pts;
  scoreEl.textContent = score;
  if(score > best){ best = score; localStorage.setItem('cxk_jump_best', best); bestEl.textContent = '最高 ' + best; }
  return pts;
}
function addCoin(n){
  coins += n;
  localStorage.setItem('cxk_coins', coins);
  coinEl.textContent = '💰 ' + coins;
  startCoinsEl.textContent = coins;
}
function updateComboHud(){
  if(mult > 1){
    comboEl.textContent = '🔥 连击' + combo + ' · x' + mult;
    comboEl.style.display = 'block';
  } else {
    comboEl.style.display = 'none';
  }
}
function popup(text, color, big, x, y){
  popups.push({
    x: (x !== undefined) ? x : player.x - camX,
    y: (y !== undefined) ? y : player.y - 56,
    text: text, t: 0, big: !!big, color: color || '#5fa8e0'
  });
}
function burst(x, y, color, n){
  if(particles.length > 220) return;
  for(let i = 0; i < n; i++){
    particles.push({
      x: x, y: y,
      vx: rnd(-140, 140), vy: rnd(-260, -40),
      t: 0, life: rnd(0.35, 0.7),
      color: color, size: rnd(2.5, 5.5)
    });
  }
}

/* ---------------- 落地（无自动归位！） ---------------- */
function landOn(box, scored){
  player.y = topY;
  player.vx = 0; player.vy = 0;
  player.rot = 0;
  player.sx = 1.25; player.sy = 0.75;
  player.landed = false;
  player.standingBox = box;
  state = STATE.IDLE;

  if(scored){
    while(boxes.length > 1 && boxes[0] !== box) boxes.shift();
    player.targetBox = boxes[1] || null;
    while(boxes.length < 5) spawnNext();
    if(!player.targetBox) player.targetBox = boxes[1];

    const isP = box.canPerfect !== false && isPerfect(box, player.x);
    const base = (box.type === 'cracked') ? 20 : 10;
    if(isP){
      combo++; maxCombo = Math.max(maxCombo, combo);
      mult = Math.min(5, 1 + 0.5 * (combo - 1));
      perfects++;
      addScore(Math.round(25 * mult));
      addCoin(1);
      popup('PERFECT +' + Math.round(25 * mult), '#ffd700', true);
      burst(player.x - camX, topY - 26, '#ffd700', 18);
      playPerfect();
    } else {
      combo = 0; mult = 1;
      addScore(Math.round(base * mult));
      popup('+' + Math.round(base * mult), '#5fa8e0', false);
    }
    updateComboHud();

    if(box.type === 'coin'){
      addCoin(2);
      popup('💰 +2', '#ffb64d', false);
      burst(player.x - camX, topY - 24, '#ffc940', 12);
      playCoin();
    }
    if(box.type === 'cracked'){
      box.cracked = true; box.crackT = 0;
      popup('咔嚓！快走', '#c98a4a', false);
      playCrack();
    }
    if(box.type === 'spring'){
      popup('弹簧！', '#3ecf8e', false);
      burst(player.x - camX, topY - 22, '#7be0ff', 14);
      playSpring();
      state = STATE.FLY;
      // 自适应弹射：按到下一个台子中心的距离算速度，保证落得到
      const tgt2 = player.targetBox;
      const dT = tgt2 ? Math.max(0, (tgt2.x + tgt2.w/2) - player.x) : MAX_DIST;
      const springFlight = 2 * VY0 * 1.18 / G;
      player.vx = Math.min(MAX_VX * 1.25, Math.max(80, dT / springFlight));
      player.vy = -VY0 * 1.18;
      player.landed = false;
      player.standingBox = null;
      jumps++;
      jumpsEl.textContent = jumps + ' 跳';
      playJump();
      return;
    }
    if(score % 10 === 0){
      popup(pick(MILESTONE), '#e0688a', true, W/2, H*0.3);
      addCoin(3);
    }
  } else {
    combo = 0; mult = 1;
    updateComboHud();
    popup('太短了…', '#8a97ad', false);
  }
}

function die(reason){
  state = STATE.DEAD;
  deadT = 0;
  player.vx = 0;
  if(reason) diedBy = reason;
  playFail();
}

/* ---------------- 更新 ---------------- */
let last = 0;
function update(dt){
  dt = Math.min(dt, 0.025);
  gameT += dt;

  // 方块：移动台子的摆动 + 碎台子计时
  for(const b of boxes){
    if(b.moving){
      b.prevX = b.x;
      b.phase += b.spd * dt;
      b.x = b.baseX + Math.sin(b.phase) * b.range;
    }
    if(b.cracked && !b.dead){
      b.crackT += dt;
      if(b.crackT >= 0.9){
        b.dead = true; b.fallT = 0;
        if(player.standingBox === b && (state === STATE.IDLE || state === STATE.CHARGE)){
          popup('踩碎了！', '#c98a4a', true);
          die('crack');
        }
      }
    }
    if(b.dead){
      b.fallT += dt;
      b.fallY = b.fallT * b.fallT * 700;
      b.rot = Math.min(b.fallT * 6, 1.2);
    }
  }

  // 站在移动台子上：跟着走，被甩下去会死
  if((state === STATE.IDLE || state === STATE.CHARGE) && player.standingBox){
    const sb = player.standingBox;
    if(sb.moving){
      player.x += sb.x - sb.prevX;
      if(player.x < sb.x - LAND_PAD || player.x > sb.x + sb.w + LAND_PAD){
        popup('被甩下去了！', '#8a97ad', true);
        die('slide');
      }
    }
  }

  // 落地压扁回弹
  if(state === STATE.IDLE){
    player.sx += (1 - player.sx) * Math.min(1, dt*10);
    player.sy += (1 - player.sy) * Math.min(1, dt*10);
  }

  if(state === STATE.CHARGE){
    holdT += dt;
    charge = holdT / CHARGE_TIME;
    const c = Math.min(charge, 1);
    player.sx = 1 + 0.38*c;
    player.sy = 1 - 0.30*c;
  }

  if(state === STATE.FLY){
    player.sx += (1 - player.sx) * Math.min(1, dt*10);
    player.sy += (1 - player.sy) * Math.min(1, dt*10);
    player.vy += G * dt;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.rot = Math.min(player.vx * 0.0011, 0.32);

    // 落地检测：脚越过台面后逐帧判断（移动台子实时位置）
    if(player.y >= topY && !player.landed){
      const cur = boxes[0];
      const tgt = player.targetBox;
      const curAlive = !cur.dead;
      const onCur = curAlive && player.x >= cur.x - LAND_PAD && player.x <= cur.x + cur.w + LAND_PAD;
      const onTgt = tgt && !tgt.dead && player.x >= tgt.x - LAND_PAD && player.x <= tgt.x + tgt.w + LAND_PAD;
      if(onCur && !onTgt){
        landOn(cur, false);
      } else if(onTgt){
        landOn(tgt, true);
      } else if(player.y > topY + 70){
        die('fall');
      }
    }
  }

  // 限时模式倒计时
  if(mode === 'timed' && state !== STATE.READY && state !== STATE.DEAD){
    timeLeft -= dt;
    timerEl.textContent = Math.ceil(timeLeft);
    timerEl.style.color = timeLeft <= 10 ? '#ff5a5a' : '#455a75';
    if(timeLeft <= 0){
      timeLeft = 0;
      timerEl.textContent = '0';
      die('time');
    }
  }

  if(state === STATE.DEAD){
    deadT += dt;
    player.vy += G * dt;
    player.y += player.vy * dt;
    player.rot += 3.5 * dt;
    if(deadT > 1.1){
      finScore.textContent = score;
      finJumps.textContent = jumps;
      finBest.textContent = Math.max(best, score);
      finPerfects.textContent = perfects;
      finCombo.textContent = maxCombo;
      finCoins.textContent = '+' + (coins - coinsAtStart);
      overlayTitle.textContent = DIE_TITLES[diedBy] || '跳空了！';
      overlaySub.textContent = DIE_SUBS[diedBy] || DIE_SUBS.fall;
      overlay.classList.add('show');
      showSubmitRow();
      cardDataUrl = makeCardDataUrl();
      cardImg.src = cardDataUrl;
      cardImg.style.display = 'block';
    }
  }

  // 相机跟随
  const targetCam = Math.max(0, player.x - W*0.42);
  camX += (targetCam - camX) * Math.min(1, dt*8);

  // 飘字
  for(let i = popups.length-1; i >= 0; i--){
    const p = popups[i];
    p.t += dt; p.y -= 38*dt;
    if(p.t > 1.1) popups.splice(i, 1);
  }
  // 粒子
  for(let i = particles.length-1; i >= 0; i--){
    const p = particles[i];
    p.t += dt;
    p.vy += 500 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if(p.t > p.life) particles.splice(i, 1);
  }
}

/* ---------------- 成绩卡 ---------------- */
function makeCardDataUrl(){
  const cv = document.createElement('canvas');
  cv.width = 640; cv.height = 900;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 900);
  grad.addColorStop(0, '#ffe3ee');
  grad.addColorStop(0.55, '#f6ecff');
  grad.addColorStop(1, '#e3f0ff');
  g.fillStyle = grad;
  g.fillRect(0, 0, 640, 900);
  g.fillStyle = 'rgba(255,255,255,.5)';
  g.beginPath(); g.arc(560, 120, 110, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(70, 760, 140, 0, Math.PI*2); g.fill();
  g.textAlign = 'center';
  g.fillStyle = '#e0688a';
  g.font = 'bold 46px "Microsoft YaHei","PingFang SC",sans-serif';
  g.fillText('鸡你太美·跳一跳', 320, 110);
  g.fillStyle = '#aab4c8';
  g.font = '20px "Microsoft YaHei","PingFang SC",sans-serif';
  g.fillText(MODES[mode].label + ' · ' + dateStr(), 320, 150);
  g.fillStyle = '#455a75';
  g.font = 'bold 130px "Microsoft YaHei","PingFang SC",sans-serif';
  g.fillText(String(score), 320, 310);
  g.fillStyle = '#aaa';
  g.font = '22px "Microsoft YaHei","PingFang SC",sans-serif';
  g.fillText('SCORE · 分', 320, 348);
  g.fillStyle = '#fff';
  g.beginPath();
  g.roundRect ? g.roundRect(120, 390, 400, 240, 24) : g.rect(120, 390, 400, 240);
  g.fill();
  g.fillStyle = '#455a75';
  g.font = 'bold 26px "Microsoft YaHei","PingFang SC",sans-serif';
  g.fillText('共 ' + jumps + ' 跳', 320, 452);
  g.fillText('PERFECT × ' + perfects, 320, 502);
  g.fillText('最高连击 × ' + maxCombo, 320, 552);
  g.fillText('金币 +' + (coins - coinsAtStart), 320, 602);
  g.fillStyle = '#e0688a';
  g.font = 'bold 24px "Microsoft YaHei","PingFang SC",sans-serif';
  g.fillText(pick(MEMES) + '！', 320, 690);
  g.fillStyle = '#bbb';
  g.font = '18px "Microsoft YaHei","PingFang SC",sans-serif';
  g.fillText('由 lxo 制作 · lxoai.github.io/cxk-jump', 320, 856);
  return cv.toDataURL('image/png');
}

/* ---------------- 渲染 ---------------- */
function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#cfe6ff');
  g.addColorStop(0.7, '#eef4fb');
  g.addColorStop(1, '#fdf3e7');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for(let i = 0; i < 5; i++){
    const bx = ((i * 397 + 120 - camX * 0.25) % (W + 260) + W + 260) % (W + 260) - 130;
    const by = 40 + i * 52;
    const bw = 90 + (i % 3) * 46;
    ctx.beginPath();
    ctx.ellipse(bx, by, bw, 22, 0, 0, Math.PI*2);
    ctx.ellipse(bx + bw*0.4, by - 14, bw*0.55, 18, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawGround(){
  const g = ctx.createLinearGradient(0, groundY, 0, H);
  g.addColorStop(0, '#f2e3cc');
  g.addColorStop(1, '#e6d2b5');
  ctx.fillStyle = g;
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.fillRect(0, groundY, W, 2);
}

function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)&255, gg = (n>>8)&255, b = n&255;
  r = Math.max(0, Math.min(255, r + amt*255));
  gg = Math.max(0, Math.min(255, gg + amt*255));
  b = Math.max(0, Math.min(255, b + amt*255));
  return 'rgb(' + (r|0) + ',' + (gg|0) + ',' + (b|0) + ')';
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBox(b){
  let x = b.x - camX, w = b.w;
  let yOff = 0, rot = 0;
  if(b.dead){
    yOff = b.fallY;
    rot = b.rot;
  }
  if(x + w < -20 || x > W + 20) return;
  ctx.save();
  if(rot){
    ctx.translate(x + w/2, topY + (groundY - topY)/2);
    ctx.rotate(rot);
    ctx.translate(-(x + w/2), -(topY + (groundY - topY)/2));
  }
  if(b.dead) ctx.globalAlpha = Math.max(0, 1 - b.fallT * 0.9);
  // 侧面
  const g = ctx.createLinearGradient(0, topY, 0, groundY);
  g.addColorStop(0, b.front);
  g.addColorStop(1, shade(b.front, -0.22));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x + w*0.06, topY + yOff);
  ctx.lineTo(x + w*0.94, topY + yOff);
  ctx.lineTo(x + w, groundY + yOff);
  ctx.lineTo(x, groundY + yOff);
  ctx.closePath();
  ctx.fill();
  // 顶面
  ctx.fillStyle = b.top;
  roundRect(x, topY + yOff, w, 26, 9);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  roundRect(x + 5, topY + yOff + 4, w - 10, 8, 5);
  ctx.fill();
  const cx = x + w/2;
  // 中心标定菱形（每个台子）
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath();
  ctx.moveTo(cx, topY + yOff + 15);
  ctx.lineTo(cx + 5, topY + yOff + 21);
  ctx.lineTo(cx, topY + yOff + 27);
  ctx.lineTo(cx - 5, topY + yOff + 21);
  ctx.closePath();
  ctx.fill();
  // 目标台子：金色 PERFECT 区（脉冲）
  if(b === player.targetBox && state !== STATE.READY && state !== STATE.DEAD){
    const pz = perfectZone(b);
    const a = 0.5 + 0.3 * Math.sin(gameT * 7);
    ctx.fillStyle = 'rgba(255,215,0,' + a.toFixed(2) + ')';
    roundRect(cx - pz, topY + yOff + 14, pz*2, 9, 4);
    ctx.fill();
  }
  // 特殊台子标记
  if(b.type === 'coin'){
    ctx.font = '15px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('💰', cx, topY + yOff - 8);
  } else if(b.type === 'spring'){
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath();
    ctx.moveTo(cx - 9, topY + yOff + 12);
    ctx.lineTo(cx + 9, topY + yOff + 12);
    ctx.lineTo(cx, topY + yOff - 4);
    ctx.closePath();
    ctx.fill();
  } else if(b.type === 'cracked'){
    ctx.strokeStyle = 'rgba(90,70,50,.55)';
    ctx.lineWidth = 2;
    const fy = (topY + groundY) / 2;
    ctx.beginPath();
    ctx.moveTo(cx - 12, topY + yOff + 28);
    ctx.lineTo(cx - 5, fy - 16);
    ctx.lineTo(cx + 7, fy + 4);
    ctx.lineTo(cx + 1, fy + 26);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 7, topY + yOff + 28);
    ctx.lineTo(cx + 13, fy - 6);
    ctx.stroke();
  }
  if(b.moving){
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⇄', cx, (topY + groundY) / 2 + yOff + 5);
  }
  ctx.restore();
}

function drawPlayer(){
  const px = player.x - camX;
  const py = player.y - P_H * player.sy * 0.5;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(player.rot);
  ctx.scale(player.sx, player.sy);
  // 影子
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, P_H*0.5, P_W*0.34, 6, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  if(skin === 'ball'){
    drawBasketball();
  } else if(spriteImg.complete && spriteImg.naturalWidth > 0){
    ctx.drawImage(spriteImg, -P_W/2, -P_H/2, P_W, P_H);
    if(skin === 'hei') tint('#1a1a2e', 0.5);
    if(skin === 'gold') tint('#ffb400', 0.42);
  } else {
    ctx.fillStyle = '#e0688a';
    ctx.beginPath();
    ctx.arc(0, -4, 12, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(-8, 8, 16, 20);
  }
  ctx.restore();
}

function tint(color, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.globalCompositeOperation = 'source-atop';
  ctx.fillRect(-P_W/2, -P_H/2, P_W, P_H);
  ctx.restore();
}

function drawBasketball(){
  ctx.fillStyle = '#e8732a';
  ctx.beginPath(); ctx.arc(0, 4, 15, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#5b2c0e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 4, 15, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-15, 4); ctx.lineTo(15, 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(0, 19); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 4, 10, -Math.PI*0.35, Math.PI*0.35); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 4, 10, Math.PI*0.65, Math.PI*1.35); ctx.stroke();
}

function drawAimGuide(){
  if(state !== STATE.CHARGE) return;
  const px = player.x - camX;
  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.strokeStyle = 'rgba(95,168,224,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px, topY - 24);
  ctx.lineTo(px, groundY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawPopups(){
  for(const p of popups){
    const a = Math.max(0, 1 - p.t/1.1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate((p.t * 0.4) - 0.15);
    ctx.font = (p.big ? 'bold 34px' : 'bold 18px') + ' "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of particles){
    const a = Math.max(0, 1 - p.t / p.life);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawChargeBar(){
  if(state !== STATE.CHARGE) return;
  const c = Math.min(charge, 1);
  const px = player.x - camX;
  const bw = 46;
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  roundRect(px - bw/2, player.y - P_H - 26, bw, 8, 4);
  ctx.fill();
  ctx.fillStyle = c >= 1 ? '#ff5a5a' : '#ffb64d';
  roundRect(px - bw/2, player.y - P_H - 26, bw * c, 8, 4);
  ctx.fill();
}

function render(){
  drawSky();
  drawGround();
  for(const b of boxes) drawBox(b);
  drawPlayer();
  drawParticles();
  drawPopups();
  drawAimGuide();
  drawChargeBar();
}

/* ---------------- 主循环 ---------------- */
function loop(ts){
  const dt = (ts - last) / 1000;
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

const spriteImg = new Image();
spriteImg.src = 'cxk.png';

resize();
newGame();
state = STATE.READY;
modeTagEl.textContent = MODES[mode].label;
coinEl.textContent = '💰 ' + coins;
startCoinsEl.textContent = coins;
requestAnimationFrame(function(ts){ last = ts; requestAnimationFrame(loop); });

// 测试/调试钩子
window.__game = {
  get state(){ return state; },
  get player(){ return player; },
  get boxes(){ return boxes; },
  get score(){ return score; },
  get jumps(){ return jumps; },
  get mode(){ return mode; },
  get maxDist(){ return MAX_DIST; },
  get perfectZone(){ return perfectZone; },
  get perfects(){ return perfects; },
  get combo(){ return combo; },
  get mult(){ return mult; },
  get maxCombo(){ return maxCombo; },
  get coins(){ return coins; },
  get diedBy(){ return diedBy; },
  get timeLeft(){ return timeLeft; },
  setMode: function(m){ mode = m; newGame(); state = STATE.READY; },
  start: function(){ startGame(); },
  press: function(){ press({ preventDefault(){} }); },
  release: function(){ release({ preventDefault(){} }); },
  reset: function(){ newGame(); }
};
})();
</script>
